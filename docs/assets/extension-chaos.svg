<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="extBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040813"/>
      <stop offset="50%" stop-color="#081122"/>
      <stop offset="100%" stop-color="#03060E"/>
    </linearGradient>

    <radialGradient id="extRadar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>

    <filter id="neonBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes extSweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes togglePulse {
      0%, 100% { fill: #0284C7; }
      50% { fill: #38BDF8; }
    }
    @keyframes activeBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .sweep-rotor {
      transform-origin: 220px 224px;
      animation: extSweep 4s linear infinite;
    }
    .toggle-active {
      animation: togglePulse 2s ease-in-out infinite;
    }
    .active-dot {
      animation: activeBlink 1.5s ease-in-out infinite;
    }
    .tech-font {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .code-font {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
  </style>

  <!-- Frame Background -->
  <rect width="1200" height="420" rx="14" fill="url(#extBg)"/>
  <rect x="1" y="1" width="1198" height="418" rx="13" fill="none" stroke="#0284C7" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- Top Title Bar -->
  <g transform="translate(40, 32)">
    <circle cx="6" cy="6" r="4" fill="#38BDF8" class="active-dot"/>
    <text x="20" y="10" fill="#38BDF8" font-size="12" font-weight="700" letter-spacing="1.5" class="code-font">
      CHROME EXTENSION (MV3) &amp; QA CHAOS SIMULATOR INSTRUMENTATION
    </text>
  </g>

  <!-- LEFT: EXTENSION POPUP UI REPLICA (Exact match to popup.html) -->
  <g transform="translate(40, 56)">
    <!-- Extension Frame -->
    <rect width="360" height="336" rx="12" fill="#0B111E" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Header -->
    <rect x="0" y="0" width="360" height="38" rx="11" fill="#0F172A"/>
    <rect x="14" y="9" width="20" height="20" rx="5" fill="#FFFFFF"/>
    <text x="20" y="24" fill="#000000" font-size="13" font-weight="900" class="tech-font">R</text>
    <text x="42" y="23" fill="#FFFFFF" font-size="12" font-weight="800" letter-spacing="1.5" class="code-font">REPROLENS</text>
    <rect x="286" y="10" width="60" height="18" rx="4" fill="#064E3B"/>
    <text x="316" y="23" fill="#6EE7B7" font-size="8" font-weight="700" text-anchor="middle" class="code-font">MV3 MAIN</text>

    <!-- Radar Ambient Bug Hunter Card -->
    <g transform="translate(14, 48)">
      <rect width="332" height="130" rx="8" fill="#081426" stroke="#0284C7" stroke-width="1" stroke-opacity="0.4"/>
      
      <!-- Ambient Radar Grid & Sweep inside card -->
      <g opacity="0.6">
        <circle cx="166" cy="65" r="50" fill="none" stroke="#0284C7" stroke-width="0.8" stroke-dasharray="3 3"/>
        <circle cx="166" cy="65" r="25" fill="none" stroke="#0284C7" stroke-width="0.8"/>
        <line x1="166" y1="15" x2="166" y2="115" stroke="#0284C7" stroke-width="0.8" stroke-opacity="0.3"/>
        <line x1="116" y1="65" x2="216" y2="65" stroke="#0284C7" stroke-width="0.8" stroke-opacity="0.3"/>
        <g class="sweep-rotor" style="transform-origin: 180px 113px;">
          <path d="M 166 65 L 216 65 A 50 50 0 0 0 201 30 Z" fill="url(#extRadar)"/>
        </g>
      </g>

      <!-- Card Header -->
      <circle cx="14" cy="16" r="3.5" fill="#38BDF8" class="active-dot"/>
      <text x="24" y="19" fill="#7DD3FC" font-size="9" font-weight="700" letter-spacing="1" class="code-font">AI BUG HUNTER &amp; AUTO-SOLVER</text>
      <rect x="256" y="8" width="64" height="16" rx="4" fill="#0369A1" fill-opacity="0.3"/>
      <text x="288" y="19" fill="#38BDF8" font-size="8" font-weight="700" text-anchor="middle" class="code-font">SCANNING</text>

      <text x="14" y="44" fill="#E2E8F0" font-size="10" font-weight="600" class="tech-font">Radar Active: Monitoring DOM &amp; Network</text>
      <text x="14" y="60" fill="#94A3B8" font-size="8.5" class="tech-font">Observing clickstream, unhandled rejections across tabs.</text>


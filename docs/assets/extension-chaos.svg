    <g transform="translate(14, 188)">
      <rect width="332" height="136" rx="8" fill="#13100B" stroke="#D97706" stroke-width="1" stroke-opacity="0.4"/>
      
      <!-- Card Header -->
      <text x="14" y="18" fill="#F59E0B" font-size="9" font-weight="800" letter-spacing="1" class="code-font">CHAOS SIMULATOR (ANY SITE)</text>
      <rect x="286" y="7" width="32" height="15" rx="3" fill="#78350F"/>
      <text x="302" y="18" fill="#FDE68A" font-size="8" font-weight="800" text-anchor="middle" class="code-font">QA</text>

      <!-- Toggle 1: Slow 3G Latency -->
      <g transform="translate(14, 30)">
        <text x="0" y="12" fill="#E2E8F0" font-size="9.5" font-weight="600" class="tech-font">Slow 3G Latency (+2.5s)</text>
        <!-- iOS Toggle Pill -->
        <rect x="268" y="0" width="36" height="18" rx="9" fill="#0284C7" class="toggle-active"/>
        <circle cx="295" cy="9" r="7" fill="#FFFFFF"/>

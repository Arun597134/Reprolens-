    <g transform="translate(16, 48)">
      <text x="0" y="18" fill="#64748B" font-size="10" class="code-font">[00:00:00.120] Content Script: MAIN-world fetch proxy injected.</text>
      <text x="0" y="38" fill="#64748B" font-size="10" class="code-font">[00:00:00.450] Chaos Activated: Simulated network latency set to +2500ms.</text>
      <text x="0" y="58" fill="#F59E0B" font-size="10" class="code-font">[00:00:01.890] Intercepted POST /api/checkout payload.</text>
      <text x="0" y="78" fill="#38BDF8" font-size="10" class="code-font">[00:00:01.892] Zero-PII Scrubber: Luhn check matched 4532-****-****-8841. Masked.</text>
      <text x="0" y="98" fill="#38BDF8" font-size="10" class="code-font">[00:00:01.893] Zero-PII Scrubber: Authorization Bearer header purged from packet.</text>
      <text x="0" y="118" fill="#EF4444" font-size="10" font-weight="700" class="code-font">[00:00:02.100] Chaos Injected: Injected synthetic HTTP 500 Internal Server Error.</text>
      <text x="0" y="138" fill="#10B981" font-size="10" font-weight="700" class="code-font">[00:00:02.102] Autonomous Auto-Shield: Injected live AST exception trap in 0.8ms.</text>
      <text x="0" y="158" fill="#6EE7B7" font-size="10" class="code-font">[00:00:02.103] Immunity Confirmed: React unmount prevented, client kept checkout session.</text>
    </g>

    <!-- Action Bar -->
    <g transform="translate(16, 230)">
      <rect width="698" height="84" rx="8" fill="#040A14" stroke="#0284C7" stroke-width="1" stroke-opacity="0.3"/>
      <g transform="translate(18, 16)">
        <text x="0" y="16" fill="#FFFFFF" font-size="12" font-weight="700" class="tech-font">Deterministic Playwright Artifact Generated</text>
        <text x="0" y="34" fill="#94A3B8" font-size="10.5" class="tech-font">Autonomous test spec compiled to <tspan fill="#38BDF8" class="code-font">backend/storage/regression_tests/test_bug_84.py</tspan></text>
        <text x="0" y="50" fill="#34D399" font-size="10" font-weight="700" class="code-font">1-Click Jump Ready: vscode://file/.../CheckoutModal.tsx:84:19</text>
      </g>
    </g>
  </g>
</svg>

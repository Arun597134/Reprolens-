      <rect x="14" y="82" width="304" height="34" rx="6" fill="#0284C7" filter="url(#neonBlue)"/>
      <text x="166" y="103" fill="#FFFFFF" font-size="10" font-weight="800" letter-spacing="1" text-anchor="middle" class="code-font">SIMULATE BUG &amp; AUTO-SOLVE</text>
